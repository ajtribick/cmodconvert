[package]
name = "cmodconvert"
version = "0.2.1"
edition = "2021"
authors = ["Andrew Tribick"]
license = "MIT"

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.5.21", features = ["derive"] }
memchr = "2.7.4"
num-derive = "0.4.2"
num-traits = "0.2.19"
pathdiff = "0.2.2"
rustc-hash = "2.0.0"
smallvec = { version = "1.13.2", features = ["const_generics"] }
thiserror = "2.0.3"

[profile.release-lto]
inherits = "release"
codegen-units = 1
debug-assertions = false
overflow-checks = false
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
